# Can a stranger build the tag and use what it contains?
#
# Every other language answers that through a registry: release.yml's outside consumers
# install a published artifact and run it. C++ has no registry — its CMake package is
# consumed from the immutable public tag — so this workflow IS the C++ equivalent, and the
# matrix should not say "published" for C++ until it has run green against a real tag.
#
# Read-only by construction: no secrets, `contents: read`, no publish step of any kind. It
# clones the PUBLIC repository at the tag and builds from that clone. Nothing from the
# workspace checkout participates except this repository's own script — a build that
# succeeded because the checkout happened to be lying in the working directory would prove
# something about the runner, not about the tag.

name: verify-source

on:
  workflow_dispatch:
    inputs:
      tag:
        description: An existing public release tag, for example v0.8.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-source-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve the tag on the public remote
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      # Resolved from the PUBLIC remote with git ls-remote, not from the checkout: the
      # question is what a stranger gets, and a local ref could differ from what is served.
      - name: resolve
        id: resolve
        run: node conformance/verify-source.mjs resolve "${{ inputs.tag }}"

  cpp:
    name: cpp consumes the tag's package
    needs: resolve
    # ubuntu-26.04 for OpenSSL >= 3.2 — see the note in conformance.yml; `latest` is 24.04,
    # whose 3.0.13 is below the floor Ed25519ph-with-context needs.
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      # The same two floors as the cpp job in conformance.yml, and deliberately duplicated
      # rather than factored into a composite action: this workflow must stand on its own,
      # since its whole claim is that nothing outside the tag and these two libraries is
      # needed to build archon's C++ package.
      - name: the two crypto libraries, at their floors
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libssl-dev
          SODIUM=1.0.22
          curl -fsSL "https://download.libsodium.org/libsodium/releases/libsodium-$SODIUM.tar.gz" -o /tmp/s.tgz
          tar -xzf /tmp/s.tgz -C /tmp
          (cd "/tmp/libsodium-$SODIUM" && ./configure --prefix=/usr/local --quiet && make -j"$(nproc)" >/dev/null && sudo make install >/dev/null)
          sudo ldconfig
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
          got=$(pkg-config --modversion libsodium)
          echo "libsodium $got"
          pkg-config --atleast-version=1.0.21 libsodium \
            || { echo "::error::libsodium $got is below the 1.0.21 floor — it would accept mixed-order points"; exit 1; }
      # Clones the tag, asserts its HEAD against the SHA resolve found — a tag moved between
      # the two jobs fails here rather than being silently verified as something else — then
      # builds, runs the TAG's oracle over the TAG's vectors, installs the exported package,
      # and builds the tag's own consumer against that installation.
      - name: build the tag and consume its installed package
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
        run: |
          node conformance/verify-source.mjs verify \
            "${{ inputs.tag }}" "${{ needs.resolve.outputs.sha }}" cpp
