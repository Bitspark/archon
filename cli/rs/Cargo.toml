# archon-cli: the `archon` command for the Rust lane — key / keygen / sign / verify / version.
#
# A thin presentation + I/O layer over archon-core, never part of the library surface.
# Three native binaries (cli/rs, cli/go, cli/ts) build the SAME `archon` command with
# byte-identical stdout, pinned by cli/smoke.mjs. The one deliberately-unpinned edge is
# keygen's RNG, which lives HERE and not in the library (ADR 0002: the codec has no RNG).
#
# `key` and `keygen` were carved out of thesmos's CLI (cli/rs/src/cmd/{key,keygen}.rs +
# pubrender.rs) on 2026-09-09 — docs/growth-plan.md §8.2: they contained no thesmos term
# and archon shipped no CLI at all. `sign` / `verify` are new: raw bytes, domain-aware.
[package]
name = "bitspark-archon-cli"
version = "0.6.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Bitspark/archon"
description = "archon CLI: key / keygen / sign / verify over the identity floor."

[[bin]]
name = "archon"
path = "src/main.rs"

[dependencies]
bitspark-archon-core = { path = "../../core/rs", version = "0.6.1" }
# The layer above the floor. `login` is the only part of it this CLI touches: the login
# scheme's binding and proof, which the CLI consumes and never reimplements.
bitspark-archon-sdk = { path = "../../sdk/rs", version = "0.6.1" }
# keygen's OS CSPRNG — the CLI's, never the library's.
getrandom = "0.3"
# login's HTTP + JSON. minreq is chosen on a MEASUREMENT, not a preference: against a
# 47-crate baseline it adds 21 crates, where ureq 2 adds 52 and ureq 3 adds 69. It is
# blocking and pulls no async runtime, which suits a CLI that makes two requests and exits.
# native-tls was ruled out: it makes the Windows CI leg depend on a build environment.
# serde_json is the transport codec; the login SCHEME is bytes, not JSON, so nothing
# security-bearing depends on it.
minreq = { version = "2", features = ["https-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Custody (ADR 0007 §A): the key store's Argon2id and XChaCha20-Poly1305, the NFC
# normaliser its password rule names, and a terminal prompt that does not echo. None of
# them reach core/ or sdk/.
argon2 = "0.5"
chacha20poly1305 = "0.10"
unicode-normalization = "0.1"
rpassword = "7"

# The keystore conformance driver is a dev/CI artifact, not part of the command, so it is
# a separate bin behind a feature that is off by default. It needs no dependency of its
# own: serde_json is already a login dependency above.
[features]
default = []
conformance-cli = []

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"
required-features = ["conformance-cli"]
