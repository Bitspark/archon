# An OUTSIDE consumer of archon's SERVER tier from crates.io: the login handler, driven
# through a whole login in-process (src/main.rs). `ARCHON_VERSION` is substituted by the
# release workflow (or by hand: sed -i "s/ARCHON_VERSION/0.9.0/" Cargo.toml) before `cargo
# run` in a copy of this directory with a fresh CARGO_HOME: no path dependency, no workspace,
# no vendored source. `=` pins the exact version. Run for tags whose server/rs has
# `Admitted` (0.9.0 on, #69).
[package]
name = "archon-outside-server-consumer"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
bitspark-archon-core = "=ARCHON_VERSION"
bitspark-archon-sdk = "=ARCHON_VERSION"
bitspark-archon-server = "=ARCHON_VERSION"
# The consumer's own JSON, for building and reading the four routes' bodies.
serde_json = "1"
